<script src="/uv/uv.bundle.js"></script>
<script src="/uv/uv.config.js"></script>

<script>
  // Register the engine immediately
  const swConfig = {
    scope: __uv$config.prefix,
    bare: '/bare/'
  };

  async function registerSW() {
    if ('serviceWorker' in navigator) {
      await navigator.serviceWorker.register('/uv/uv.sw.js', {
        scope: __uv$config.prefix
      });
    }
  }

  registerSW();

  const input = document.getElementById('url-input');
  const btn = document.getElementById('go-btn');
  const proxyFrame = document.getElementById('proxy-frame');

  async function navigate(url) {
    if (!url.trim()) return;

    // Search or URL logic
    if (!url.includes('.') || url.includes(' ')) {
      url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
    } else if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }

    btn.textContent = '...';
    
    // Ensure SW is ready before loading
    await registerSW();

    const encodedUrl = __uv$config.prefix + __uv$config.encodeUrl(url);
    proxyFrame.src = encodedUrl;

    proxyFrame.onload = () => {
      btn.textContent = 'GO';
      document.getElementById('frame-bar-url').textContent = url;
      document.getElementById('frame-container').classList.add('shown');
      document.getElementById('frame-container').style.display = 'flex';
    };
  }

  btn.addEventListener('click', () => navigate(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') navigate(input.value); });
</script>
