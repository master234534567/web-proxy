<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRXY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --surface: #111;
      --border: #222;
      --accent: #c8ff00;
      --accent-dim: #8db300;
      --text: #f0f0f0;
      --muted: #555;
      --mono: 'Space Mono', monospace;
      --display: 'Syne', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,255,0,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,255,0,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial glow */
    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(200,255,0,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 700px;
      padding: 0 1.5rem;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-family: var(--display);
      font-size: clamp(3.5rem, 12vw, 6rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--accent);
      margin-bottom: 0.15em;
      position: relative;
      display: inline-block;
    }

    .logo span {
      color: var(--text);
    }

    .tagline {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3rem;
    }

    .search-wrapper {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border);
      background: var(--surface);
      position: relative;
      transition: border-color 0.2s;
    }

    .search-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 0 24px rgba(200,255,0,0.08);
    }

    .protocol-badge {
      display: flex;
      align-items: center;
      padding: 0 1rem;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border-right: 1px solid var(--border);
      white-space: nowrap;
      user-select: none;
    }

    #url-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 1.1rem 1.25rem;
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--text);
      caret-color: var(--accent);
    }

    #url-input::placeholder {
      color: var(--muted);
    }

    #go-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0 1.75rem;
      font-family: var(--display);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    #go-btn:hover {
      background: #d9ff26;
    }

    #go-btn:active {
      transform: scale(0.97);
    }

    #go-btn.loading {
      background: var(--accent-dim);
      cursor: wait;
    }

    .hints {
      margin-top: 1.25rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .hint {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      background: #141414;
      border: 1px solid #1e1e1e;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .hint:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .status {
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      min-height: 1.2em;
    }

    .status.error { color: #ff4444; }
    .status.ok    { color: var(--accent); }

    /* Frame overlay */
    #frame-container {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      flex-direction: column;
      background: var(--bg);
    }

    #frame-container.visible { display: flex; }

    .frame-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .frame-bar-url {
      flex: 1;
      font-size: 0.72rem;
      color: var(--muted);
      font-family: var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .frame-close {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.7rem;
      padding: 0.3rem 0.8rem;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: border-color 0.15s, color 0.15s;
    }

    .frame-close:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #proxy-frame {
      flex: 1;
      border: none;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">PR<span>XY</span></div>
    <div class="tagline">Web proxy — fetch anything</div>

    <div class="search-wrapper">
      <div class="protocol-badge">URL</div>
      <input
        id="url-input"
        type="text"
        placeholder="https://example.com"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
      />
      <button id="go-btn">GO</button>
    </div>

    <div class="hints">
      <div class="hint" data-url="https://wikipedia.org">wikipedia.org</div>
      <div class="hint" data-url="https://news.ycombinator.com">hacker news</div>
      <div class="hint" data-url="https://httpbin.org">httpbin.org</div>
      <div class="hint" data-url="https://example.com">example.com</div>
    </div>

    <div class="status" id="status"></div>
  </div>

  <!-- Full-screen frame overlay -->
  <div id="frame-container">
    <div class="frame-bar">
      <button class="frame-close" id="frame-close">← BACK</button>
      <div class="frame-bar-url" id="frame-bar-url"></div>
    </div>
    <iframe id="proxy-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  </div>

  <script>
    const input = document.getElementById('url-input');
    const btn   = document.getElementById('go-btn');
    const status = document.getElementById('status');
    const frameContainer = document.getElementById('frame-container');
    const proxyFrame = document.getElementById('proxy-frame');
    const frameBarUrl = document.getElementById('frame-bar-url');
    const frameClose = document.getElementById('frame-close');

    function setStatus(msg, type = '') {
      status.textContent = msg;
      status.className = 'status' + (type ? ' ' + type : '');
    }

    function navigate(url) {
      if (!url.trim()) { setStatus('Enter a URL.', 'error'); return; }
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

      setStatus('Fetching…');
      btn.textContent = '…';
      btn.classList.add('loading');
      btn.disabled = true;

      const proxyUrl = '/proxy?url=' + encodeURIComponent(url);
      frameBarUrl.textContent = url;
      proxyFrame.src = proxyUrl;

      proxyFrame.onload = () => {
        btn.textContent = 'GO';
        btn.classList.remove('loading');
        btn.disabled = false;
        setStatus('Loaded — ' + url, 'ok');
        frameContainer.classList.add('visible');
      };

      proxyFrame.onerror = () => {
        btn.textContent = 'GO';
        btn.classList.remove('loading');
        btn.disabled = false;
        setStatus('Failed to load.', 'error');
      };
    }

    btn.addEventListener('click', () => navigate(input.value));
    input.addEventListener('keydown', e => { if (e.key === 'Enter') navigate(input.value); });

    document.querySelectorAll('.hint').forEach(h => {
      h.addEventListener('click', () => {
        input.value = h.dataset.url;
        navigate(h.dataset.url);
      });
    });

    frameClose.addEventListener('click', () => {
      frameContainer.classList.remove('visible');
      proxyFrame.src = '';
      setStatus('');
    });
  </script>
</body>
</html>
